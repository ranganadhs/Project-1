# On-demand builds, from the EAS dashboard or the CLI:
#
#   eas workflow:run .eas/workflows/manual.yml -F profile=development -F platform=ios
#   eas workflow:run .eas/workflows/manual.yml -F profile=preview -F platform=all -F submit=true
#
# This is how development clients get built: nothing builds them automatically,
# because a dev client only needs rebuilding when the native fingerprint moves,
# and that is a deliberate act. Install a simulator build afterwards with
#   eas build:run -p ios -e development --latest
#
# `eas workflow:run` uploads the LOCAL working directory unless `--ref` is
# passed, so an uncommitted change builds. `requireCommit` in eas.json does not
# apply here.
name: Manual build
run_name: Manual ${{ inputs.profile }} build (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: eas.json build profile
        options: [development, development-device, preview, production]
        required: true
      platform:
        type: choice
        options: [ios, android, all]
        default: all
      submit:
        type: boolean
        description: Submit store builds with the submit profile of the same name
        default: false

defaults:
  image: sdk-57
  tools:
    corepack: true

jobs:
  build_ios:
    name: iOS build
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    type: build
    params:
      platform: ios
      profile: ${{ inputs.profile }}

  build_android:
    name: Android build
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    type: build
    params:
      platform: android
      profile: ${{ inputs.profile }}

  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    if: ${{ inputs.submit && (inputs.profile == 'preview' || inputs.profile == 'production') }}
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: ${{ inputs.profile }}

  # Only `production` has an Android submit profile: preview builds an APK,
  # which Play refuses for a new app.
  submit_android:
    name: Submit Android
    needs: [build_android]
    if: ${{ inputs.submit && inputs.profile == 'production' }}
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: ${{ inputs.profile }}
