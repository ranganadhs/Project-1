# Preview release, on every merge into `preview`.
#
# WHAT IT PRODUCES, and why the two platforms differ:
#
#   iOS      a store-distribution build submitted to TestFlight. TestFlight is
#            the only way onto a tester's phone without collecting their UDID
#            first, which is why this is `store` and not `internal`.
#   Android  an APK, internal distribution. Installable straight from the EAS
#            link with no store round-trip. An app-bundle would be correct for
#            Play and useless for handing someone a build — and Play refuses
#            APKs for new apps, so there is no Android submit here on purpose.
#
# WHY IT DOES NOT ALWAYS BUILD. A build is only needed when the NATIVE
# fingerprint moved. The `fingerprint` job hashes the project the same way the
# `preview` profile would, `get-build` looks for an existing preview build with
# that hash, and only a miss triggers a build. A JS-only merge instead publishes
# an OTA update to the `preview` channel, which costs one Linux minute rather
# than two builds. Both paths are correct by construction: the update can only
# reach a binary whose runtime version it matches (see docs/ota-updates.md).
#
# `environment` is set explicitly on every non-build job. Unset, EAS assumes
# `production` for fingerprint and update jobs, so the hash would be computed
# against the wrong env vars and never match a preview build.
#
# The first job costs seconds and stops everything when a placeholder is still
# in eas.json or app.config.ts — a build that cannot be submitted is minutes
# nobody wanted to pay for.
name: Preview release

on:
  push:
    branches: ['preview']

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  image: sdk-57
  tools:
    corepack: true

jobs:
  release_config:
    name: Release config is filled in
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: check
        run: pnpm check:release

  fingerprint:
    name: Fingerprint
    needs: [release_config]
    type: fingerprint
    environment: preview

  get_ios_build:
    name: Existing iOS preview build?
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  get_android_build:
    name: Existing Android preview build?
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: iOS build
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id == '' }}
    type: build
    params:
      platform: ios
      profile: preview

  build_android:
    name: Android APK
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id == '' }}
    type: build
    params:
      platform: android
      profile: preview

  # Separate JOB rather than a step inside the build, and `needs` is what makes
  # that work: a failed build never looks like a failed submission, and nothing
  # reaches TestFlight that did not compile. The `groups` in the submit profile
  # add the build to the named internal testing group.
  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: preview

  update_ios:
    name: OTA update (iOS, preview)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id != '' }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: ios

  update_android:
    name: OTA update (Android, preview)
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id != '' }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
